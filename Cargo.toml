[package]
name = "jame-prompt"
version = "1.0.0"
edition = "2021"
authors = ["Roy Mejia"]
description = "JamePrompt — Lightweight and minimal local prompt manager"
license = "MIT"
exclude = [
  "packaging/arch/pkg",
  "packaging/arch/src",
  "packaging/arch/target",
]

[dependencies]
iced = { version = "0.13.1", features = ["tokio", "image"] }
tokio = { version = "1", features = ["rt", "time"] }
iced_lucide = "0.1.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0.1"
global-hotkey = "0.7.0"
rdev = "0.5.3"
tracing = "0.1"
tracing-subscriber = "0.3"
tray-icon = "0.23"
image = "0.25"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[build-dependencies]
iced_lucide = "0.1.0"
winresource = "0.1"
buildtime-png = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

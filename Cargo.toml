[package]
name = "jame-prompt"
version = "1.2.0-beta.10"
edition = "2021"
rust-version = "1.88"
authors = ["Roy Mejia"]
description = "JamePrompt — Lightweight and minimal local prompt manager"
license = "MIT"
repository = "https://github.com/roymejia2217/JamePrompt"
exclude = [
  "packaging/arch/pkg",
  "packaging/arch/src",
  "packaging/arch/target",
]

[features]
desktop-integration-tests = []

[dependencies]
iced = { version = "=0.14.0", features = ["tokio", "image", "advanced"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
futures-channel = "0.3"
futures-executor = "0.3"
futures-util = "0.3"
iced_lucide = "0.1.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = { version = "0.15.4", default-features = false, features = ["gtk3"] }
directories = "5.0.1"
global-hotkey = "0.7.0"
rdev = "0.5.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit = "=0.25.1"
accesskit_unix = "=0.24.0"
gtk = "0.18"
ksni = { version = "=0.3.6", default-features = false, features = ["tokio"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "raw_handle", "wayland"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
tray-icon = "0.23"

[build-dependencies]
iced_lucide = "0.1.0"
winresource = "0.1"
buildtime-png = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

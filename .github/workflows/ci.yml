name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            python3-pil \
            desktop-file-utils

      - name: Run tests
        run: cargo test --locked


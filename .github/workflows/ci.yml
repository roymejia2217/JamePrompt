name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout pull request history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install commit validation dependencies
        run: npm ci

      - name: Self-test commit message contract
        run: bash scripts/test-commitlint.sh

      - name: Validate pull request commits
        run: npm exec --no -- commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            python3-pil \
            python3-yaml \
            desktop-file-utils \
            xvfb \
            xauth \
            xdotool \
            zenity

      - name: Validate workflow YAML validator
        run: python3 scripts/validate_workflow_yaml.py --self-test

      - name: Validate GitHub workflow YAML syntax
        run: python3 scripts/validate_workflow_yaml.py .github/workflows

      - name: Validate shared GitHub REST transport
        run: python3 scripts/github_api.py --self-test

      - name: Validate release version contract
        run: python3 scripts/prepare_release_version.py --self-test

      - name: Validate release staging contract
        run: python3 scripts/stage_release_assets.py --self-test

      - name: Validate release gate contract
        run: python3 scripts/validate_release_gate.py --self-test

      - name: Validate release metadata contract
        run: python3 scripts/validate_release_metadata.py --self-test

      - name: Validate published Release asset immutability contract
        run: python3 scripts/validate_existing_release_assets.py --self-test

      - name: Validate GitHub Release existence probe
        run: python3 scripts/probe_github_release.py --self-test

      - name: Validate pull request description contract
        run: python3 scripts/validate_pr_description.py --self-test

      - name: Validate RPM builder version gate
        run: bash scripts/build_rpm_fedora.sh --self-test

      - name: Validate Arch snapshot builder contract
        run: bash scripts/build_arch_package.sh --self-test

      - name: Validate main CI evidence validator
        run: python3 scripts/validate_main_ci_evidence.py --self-test

      - name: Validate reusable release run provenance validator
        run: python3 scripts/validate_reusable_release_run.py --self-test

      - name: Validate CI and Release parity validator
        run: python3 scripts/validate_ci_release_parity.py --self-test

      - name: Validate CI and Release parity
        run: python3 scripts/validate_ci_release_parity.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Linux tests
        run: cargo test --locked --all-targets

      - name: Build native hotkey smoke binary
        run: cargo build --locked --bin jame-prompt

      - name: Run X11 native hotkey auto-paste smoke
        run: xvfb-run -a -s "-screen 0 1280x800x24" bash scripts/smoke/native-hotkey-x11.sh target/debug/jame-prompt

      - name: Install verified AppImage tools
        run: |
          TOOL_DIR="$RUNNER_TEMP/jameprompt-appimage-tools"
          scripts/install_appimage_tools.sh "$TOOL_DIR"
          echo "$TOOL_DIR" >> "$GITHUB_PATH"

      - name: Build release AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/appimage/build-appimage.sh

      - name: Run release AppImage X11 native hotkey auto-paste smoke
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [ -z "$APPIMAGE" ]; then
            echo "No release AppImage found for protected CI smoke" >&2
            exit 1
          fi
          xvfb-run -a -s "-screen 0 1280x800x24" bash scripts/smoke/native-hotkey-x11.sh "$APPIMAGE"

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Windows tests
        run: cargo test --locked --all-targets

      - name: Build native hotkey smoke binary
        run: cargo build --locked --bin jame-prompt

      - name: Run Windows native hotkey auto-paste smoke
        shell: pwsh
        run: ./scripts/smoke/native-hotkey-windows.ps1 -Binary ./target/debug/jame-prompt.exe

      - name: Build Windows release native hotkey binary
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bin jame-prompt

      - name: Validate Windows release runtime dependencies
        shell: pwsh
        run: ./scripts/validate_windows_runtime.ps1 -BinaryDirectory ./target/x86_64-pc-windows-msvc/release

      - name: Run Windows release native hotkey auto-paste smoke
        shell: pwsh
        run: ./scripts/smoke/native-hotkey-windows.ps1 -Binary ./target/x86_64-pc-windows-msvc/release/jame-prompt.exe

      - name: Install pinned WiX Toolset
        run: choco install wixtoolset --version 3.14.1.20250415 --no-progress -y

      - name: Install pinned cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Build MSI
        shell: pwsh
        run: ./scripts/build_windows_msi.ps1 -Target x86_64-pc-windows-msvc -BinaryDirectory ./target/x86_64-pc-windows-msvc/release

      - name: Validate MSI install and uninstall
        shell: pwsh
        run: ./scripts/validate_windows_msi.ps1 -MsiPath ./target/wix/JamePrompt-1.1.0-x64.msi

  test_deb:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            python3-pil \
            dpkg-dev \
            desktop-file-utils \
            lintian

      - name: Build Debian package
        run: packaging/linux/build-deb.sh

      - name: Verify Debian package artifact
        run: |
          DEB_PACKAGE="$(find target/debian -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [ -z "$DEB_PACKAGE" ]; then
            echo "Debian preflight did not produce a package artifact" >&2
            exit 1
          fi
          test -s "$DEB_PACKAGE"
          scripts/validate_deb_package.sh "$DEB_PACKAGE"

      - name: Validate Debian install lifecycle
        run: |
          DEB_PACKAGE="$(find target/debian -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [ -z "$DEB_PACKAGE" ]; then
            echo "Debian lifecycle preflight did not find a package artifact" >&2
            exit 1
          fi
          docker run --rm \
            --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            debian:trixie-20260713-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd \
            bash scripts/validate_deb_install_lifecycle.sh "$DEB_PACKAGE"

  test_arch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build Arch package in pinned snapshot container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:base-devel-20260913.0.592969@sha256:70d777aaeb45befc04150df137c4d7c1b5042be442b4c904c38c6f6880bb7844 \
            bash scripts/build_arch_package.sh

      - name: Verify Arch package artifact
        run: |
          ARCH_PACKAGE="$(find packaging/arch -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          if [ -z "$ARCH_PACKAGE" ]; then
            echo "Arch preflight did not produce a package artifact" >&2
            exit 1
          fi
          test -s "$ARCH_PACKAGE"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:base-devel-20260913.0.592969@sha256:70d777aaeb45befc04150df137c4d7c1b5042be442b4c904c38c6f6880bb7844 \
            bash scripts/validate_arch_package.sh "$ARCH_PACKAGE"

      - name: Validate Arch install lifecycle
        run: |
          ARCH_PACKAGE="$(find packaging/arch -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          if [ -z "$ARCH_PACKAGE" ]; then
            echo "Arch lifecycle preflight did not find a package artifact" >&2
            exit 1
          fi
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:base-devel-20260913.0.592969@sha256:70d777aaeb45befc04150df137c4d7c1b5042be442b4c904c38c6f6880bb7844 \
            bash scripts/validate_arch_install_lifecycle.sh "$ARCH_PACKAGE"

  test_rpm:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build RPM package in pinned Fedora container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 \
            bash scripts/build_rpm_fedora.sh

      - name: Verify RPM package artifact
        run: |
          RPM_PATH="$(find target/rpmbuild/RPMS -type f -name '*.rpm' -print -quit)"
          if [ -z "$RPM_PATH" ]; then
            echo "RPM preflight did not produce a package artifact" >&2
            exit 1
          fi
          test -s "$RPM_PATH"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 \
            bash scripts/validate_rpm_package.sh "$RPM_PATH"

  test:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - test-linux
      - test-windows
      - test_deb
      - test_arch
      - test_rpm

    steps:
      - name: Require Linux, Windows, Debian, Arch, and RPM test jobs
        env:
          LINUX_RESULT: ${{ needs.test-linux.result }}
          WINDOWS_RESULT: ${{ needs.test-windows.result }}
          DEB_RESULT: ${{ needs.test_deb.result }}
          ARCH_RESULT: ${{ needs.test_arch.result }}
          RPM_RESULT: ${{ needs.test_rpm.result }}
        run: |
          test "$LINUX_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
          test "$DEB_RESULT" = "success"
          test "$ARCH_RESULT" = "success"
          test "$RPM_RESULT" = "success"

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install commit validation dependencies
        run: npm ci

      - name: Validate pull request commits
        run: npm exec --no -- commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  test-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            python3-pil \
            python3-yaml \
            desktop-file-utils \
            xvfb \
            xauth \
            xdotool \
            zenity

      - name: Validate workflow YAML validator
        run: python3 scripts/validate_workflow_yaml.py --self-test

      - name: Validate GitHub workflow YAML syntax
        run: python3 scripts/validate_workflow_yaml.py .github/workflows

      - name: Validate release version contract
        run: python3 scripts/prepare_release_version.py --self-test

      - name: Validate release staging contract
        run: python3 scripts/stage_release_assets.py --self-test

      - name: Validate release gate contract
        run: python3 scripts/validate_release_gate.py --self-test

      - name: Validate pull request description contract
        run: python3 scripts/validate_pr_description.py --self-test

      - name: Validate RPM builder version gate
        run: bash scripts/build_rpm_fedora.sh --self-test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Linux tests
        run: cargo test --locked --all-targets

      - name: Build native hotkey smoke binary
        run: cargo build --locked --bin jame-prompt

      - name: Run X11 native hotkey auto-paste smoke
        run: xvfb-run -a -s "-screen 0 1280x800x24" bash scripts/smoke/native-hotkey-x11.sh target/debug/jame-prompt

      - name: Install verified AppImage tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOOL_DIR="$RUNNER_TEMP/jameprompt-appimage-tools"
          scripts/install_appimage_tools.sh "$TOOL_DIR"
          echo "$TOOL_DIR" >> "$GITHUB_PATH"

      - name: Build release AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/appimage/build-appimage.sh

      - name: Run release AppImage X11 native hotkey auto-paste smoke
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [ -z "$APPIMAGE" ]; then
            echo "No release AppImage found for protected CI smoke" >&2
            exit 1
          fi
          xvfb-run -a -s "-screen 0 1280x800x24" bash scripts/smoke/native-hotkey-x11.sh "$APPIMAGE"

  test-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Windows tests
        run: cargo test --locked --all-targets

      - name: Build native hotkey smoke binary
        run: cargo build --locked --bin jame-prompt

      - name: Run Windows native hotkey auto-paste smoke
        shell: pwsh
        run: ./scripts/smoke/native-hotkey-windows.ps1 -Binary ./target/debug/jame-prompt.exe

      - name: Build Windows release native hotkey binary
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bin jame-prompt

      - name: Validate Windows release runtime dependencies
        shell: pwsh
        run: ./scripts/validate_windows_runtime.ps1 -BinaryDirectory ./target/x86_64-pc-windows-msvc/release

      - name: Run Windows release native hotkey auto-paste smoke
        shell: pwsh
        run: ./scripts/smoke/native-hotkey-windows.ps1 -Binary ./target/x86_64-pc-windows-msvc/release/jame-prompt.exe

  test:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - test-linux
      - test-windows

    steps:
      - name: Require Linux and Windows test jobs
        env:
          LINUX_RESULT: ${{ needs.test-linux.result }}
          WINDOWS_RESULT: ${{ needs.test-windows.result }}
        run: |
          test "$LINUX_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"

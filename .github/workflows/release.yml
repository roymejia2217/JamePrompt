name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            python3-pil \
            dpkg-dev \
            desktop-file-utils \
            lintian

      - name: Build Debian package
        run: packaging/linux/build-deb.sh

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: target/debian/*.deb
          if-no-files-found: error

  arch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Arch package in Arch Linux container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Sy --noconfirm --needed \
                archlinux-keyring \
                git \
                rust \
                cargo \
                desktop-file-utils \
                gtk3 \
                libappindicator-gtk3 \
                libx11 \
                libxtst \
                libxkbcommon \
                xdotool \
                fontconfig \
                freetype2 \
                gdk-pixbuf2 \
                hicolor-icon-theme
              useradd -m builder
              mkdir -p /tmp/arch-build
              tar \
                --exclude=./.git \
                --exclude=./target \
                --exclude=./packaging/arch/pkg \
                --exclude=./packaging/arch/src \
                --exclude=./packaging/arch/target \
                -cf - -C /workspace . | tar -xf - -C /tmp/arch-build
              chown -R builder:builder /tmp/arch-build
              su builder -c "cd /tmp/arch-build/packaging/arch && makepkg --nodeps --noconfirm --cleanbuild --clean"
              cp /tmp/arch-build/packaging/arch/*.pkg.tar.zst /workspace/packaging/arch/
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  rpm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM package in Fedora container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fedora:40 \
            bash -lc '
              dnf -y update
              dnf -y install git curl rpm-build cargo rust desktop-file-utils gtk3-devel libX11-devel libXtst-devel libxkbcommon-devel libxdo-devel
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              source /root/.cargo/env
              rustup toolchain install stable
              rustup default stable
              VERSION="$(sed -n '\''s/^version = "\(.*\)"/\1/p'\'' Cargo.toml | head -n 1)"
              RPM_TOPDIR="$PWD/target/rpmbuild"
              mkdir -p "$RPM_TOPDIR"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
              tar -czf "$RPM_TOPDIR/SOURCES/jame-prompt-${VERSION}.tar.gz" \
                --exclude="./target" \
                --exclude="./.git" \
                --transform="s#^\./#jame-prompt-${VERSION}/#" \
                -C "$PWD" .
              rpmbuild \
                --define "_topdir $RPM_TOPDIR" \
                --define "_sourcedir $RPM_TOPDIR/SOURCES" \
                -ba packaging/rpm/jame-prompt.spec
            '

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: target/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

  appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            python3-pil \
            desktop-file-utils

      - name: Download linuxdeploy
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          def download_latest(repo: str, asset_name: str, output: str) -> None:
              with urllib.request.urlopen(f"https://api.github.com/repos/{repo}/releases/latest") as response:
                  release = json.load(response)
              asset = next(item for item in release["assets"] if item["name"] == asset_name)
              with urllib.request.urlopen(asset["browser_download_url"]) as response, open(output, "wb") as handle:
                  handle.write(response.read())

          download_latest("linuxdeploy/linuxdeploy", "linuxdeploy-x86_64.AppImage", "linuxdeploy")
          pathlib.Path("linuxdeploy").chmod(0o755)
          PY
          sudo mv linuxdeploy /usr/local/bin/linuxdeploy

      - name: Download appimagetool
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          def download_latest(repo: str, asset_name: str, output: str) -> None:
              with urllib.request.urlopen(f"https://api.github.com/repos/{repo}/releases/latest") as response:
                  release = json.load(response)
              asset = next(item for item in release["assets"] if item["name"] == asset_name)
              with urllib.request.urlopen(asset["browser_download_url"]) as response, open(output, "wb") as handle:
                  handle.write(response.read())

          download_latest("AppImage/appimagetool", "appimagetool-x86_64.AppImage", "appimagetool")
          pathlib.Path("appimagetool").chmod(0o755)
          PY
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Build AppImage
        run: packaging/appimage/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - deb
      - arch
      - rpm
      - appimage
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          gh release create "$TAG_NAME" release-artifacts/* \
            --title "$TAG_NAME" \
            --notes "Automated release for $TAG_NAME"

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
      publish_run_id:
        description: Existing workflow run ID to publish from without rebuilding packages
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
  queue: max

env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Fetch protected main and tags
        run: git fetch origin main --tags --force

      - name: Validate release provenance and version
        run: python3 scripts/validate_release_gate.py --tag "$RELEASE_REF" --main-ref origin/main

  deb:
    runs-on: ubuntu-latest
    needs: release-gate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_run_id == '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Validate release source version
        run: python3 scripts/prepare_release_version.py --tag "$RELEASE_REF" --check

      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            python3-pil \
            dpkg-dev \
            desktop-file-utils \
            lintian

      - name: Build Debian package
        run: packaging/linux/build-deb.sh

      - name: Validate Debian package artifact
        run: |
          DEB_PACKAGE="$(find target/debian -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [ -z "$DEB_PACKAGE" ]; then
            echo "Debian release build did not produce a package artifact" >&2
            exit 1
          fi
          test -s "$DEB_PACKAGE"
          scripts/validate_deb_package.sh "$DEB_PACKAGE"

      - name: Validate Debian install lifecycle
        run: |
          DEB_PACKAGE="$(find target/debian -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [ -z "$DEB_PACKAGE" ]; then
            echo "Debian release lifecycle did not find a package artifact" >&2
            exit 1
          fi
          docker run --rm \
            --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            debian:trixie-20260713-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd \
            bash scripts/validate_deb_install_lifecycle.sh "$DEB_PACKAGE"

      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deb-package
          path: target/debian/*.deb
          if-no-files-found: error

  arch:
    runs-on: ubuntu-latest
    needs: release-gate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_run_id == '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Validate release source version
        run: python3 scripts/prepare_release_version.py --tag "$RELEASE_REF" --check

      - name: Build Arch package in pinned snapshot container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:base-devel-20260913.0.592969@sha256:70d777aaeb45befc04150df137c4d7c1b5042be442b4c904c38c6f6880bb7844 \
            bash scripts/build_arch_package.sh

      - name: Validate Arch package artifact
        run: |
          ARCH_PACKAGE="$(find packaging/arch -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          if [ -z "$ARCH_PACKAGE" ]; then
            echo "Arch release build did not produce a package artifact" >&2
            exit 1
          fi
          test -s "$ARCH_PACKAGE"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:base-devel-20260913.0.592969@sha256:70d777aaeb45befc04150df137c4d7c1b5042be442b4c904c38c6f6880bb7844 \
            bash scripts/validate_arch_package.sh "$ARCH_PACKAGE"

      - name: Validate Arch install lifecycle
        run: |
          ARCH_PACKAGE="$(find packaging/arch -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          if [ -z "$ARCH_PACKAGE" ]; then
            echo "Arch release lifecycle did not find a package artifact" >&2
            exit 1
          fi
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:base-devel-20260913.0.592969@sha256:70d777aaeb45befc04150df137c4d7c1b5042be442b4c904c38c6f6880bb7844 \
            bash scripts/validate_arch_install_lifecycle.sh "$ARCH_PACKAGE"

      - name: Upload Arch package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  rpm:
    runs-on: ubuntu-latest
    needs: release-gate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_run_id == '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Validate release source version
        run: python3 scripts/prepare_release_version.py --tag "$RELEASE_REF" --check

      - name: Build RPM package in Fedora container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 \
            bash scripts/build_rpm_fedora.sh

      - name: Validate RPM package artifact
        run: |
          RPM_PATH="$(find target/rpmbuild/RPMS -type f -name '*.rpm' -print -quit)"
          if [ -z "$RPM_PATH" ]; then
            echo "RPM release build did not produce a package artifact" >&2
            exit 1
          fi
          test -s "$RPM_PATH"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 \
            bash scripts/validate_rpm_package.sh "$RPM_PATH"

      - name: Upload RPM package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rpm-package
          path: target/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

  appimage:
    runs-on: ubuntu-latest
    needs: release-gate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_run_id == '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Validate release source version
        run: python3 scripts/prepare_release_version.py --tag "$RELEASE_REF" --check

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            python3-pil \
            desktop-file-utils \
            xvfb \
            xauth \
            xdotool \
            zenity

      - name: Install verified AppImage tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOOL_DIR="$RUNNER_TEMP/jameprompt-appimage-tools"
          scripts/install_appimage_tools.sh "$TOOL_DIR"
          echo "$TOOL_DIR" >> "$GITHUB_PATH"

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/appimage/build-appimage.sh

      - name: Run AppImage X11 native hotkey auto-paste smoke
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage artifact found for X11 native hotkey smoke" >&2
            exit 1
          fi
          xvfb-run -a -s "-screen 0 1280x800x24" bash scripts/smoke/native-hotkey-x11.sh "$APPIMAGE"

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: appimage-package
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: release-gate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_run_id == '' }}
    env:
      WINDOWS_TARGET: x86_64-pc-windows-msvc
      WINDOWS_PORTABLE_DIR: target/windows-portable
      RUSTFLAGS: -C target-feature=+crt-static

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Validate release source version
        shell: pwsh
        run: |
          python scripts/prepare_release_version.py --tag "$env:RELEASE_REF" --check
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $isPrerelease = $version.Contains("-").ToString().ToLowerInvariant()
          "JAMEPROMPT_IS_PRERELEASE=$isPrerelease" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Install pinned WiX Toolset
        if: env.JAMEPROMPT_IS_PRERELEASE != 'true'
        run: choco install wixtoolset --version 3.14.1.20250415 --no-progress -y

      - name: Install pinned cargo-wix
        if: env.JAMEPROMPT_IS_PRERELEASE != 'true'
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Build Windows binaries
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bins

      - name: Validate Windows runtime dependencies
        shell: pwsh
        run: ./scripts/validate_windows_runtime.ps1 -BinaryDirectory ./target/$env:WINDOWS_TARGET/release

      - name: Run Windows release native hotkey auto-paste smoke
        shell: pwsh
        run: ./scripts/smoke/native-hotkey-windows.ps1 -Binary ./target/$env:WINDOWS_TARGET/release/jame-prompt.exe

      - name: Create portable archive
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $binaryNames = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json |
            ForEach-Object { $_.packages } |
            ForEach-Object { $_ } |
            Where-Object { $_.name -eq "jame-prompt" } |
            ForEach-Object { $_.targets } |
            Where-Object { $_.kind -contains "bin" } |
            ForEach-Object { $_.name }
          if (-not $binaryNames) {
            throw "No binary targets were discovered for packaging."
          }

          $portableRoot = $env:WINDOWS_PORTABLE_DIR
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          Copy-Item LICENSE "$portableRoot/LICENSE"
          Copy-Item README.md "$portableRoot/README.md"
          foreach ($binaryName in $binaryNames) {
            $source = "target/$env:WINDOWS_TARGET/release/$binaryName.exe"
            if (-not (Test-Path $source)) {
              throw "Expected built binary not found: $source"
            }
            Copy-Item $source "$portableRoot/$binaryName.exe"
          }
          Compress-Archive -Path "$portableRoot/*" -DestinationPath "target/JamePrompt-$version-x64-portable.zip" -Force

      - name: Build MSI
        if: env.JAMEPROMPT_IS_PRERELEASE != 'true'
        shell: pwsh
        run: ./scripts/build_windows_msi.ps1 -Target $env:WINDOWS_TARGET -BinaryDirectory ./target/$env:WINDOWS_TARGET/release

      - name: Validate MSI install and uninstall
        if: env.JAMEPROMPT_IS_PRERELEASE != 'true'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          ./scripts/validate_windows_msi.ps1 -MsiPath "./target/wix/JamePrompt-$version-x64.msi"

      - name: Upload portable archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-portable
          path: target/JamePrompt-*-x64-portable.zip
          if-no-files-found: error

      - name: Upload MSI
        if: env.JAMEPROMPT_IS_PRERELEASE != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-msi
          path: target/wix/*.msi
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.release-gate.result == 'success' &&
        (
          inputs.publish_run_id != '' ||
          (
            needs.deb.result == 'success' &&
            needs.arch.result == 'success' &&
            needs.rpm.result == 'success' &&
            needs.appimage.result == 'success' &&
            needs.windows.result == 'success'
          )
        )
      }}
    needs:
      - deb
      - arch
      - rpm
      - appimage
      - windows
      - release-gate
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download artifacts from current run
        if: ${{ inputs.publish_run_id == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Validate reusable release run provenance
        if: ${{ inputs.publish_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_SHA="$(git rev-parse "${RELEASE_REF}^{}")"
          python3 scripts/validate_reusable_release_run.py \
            --run-id "${{ inputs.publish_run_id }}" \
            --tag "$RELEASE_REF" \
            --target-sha "$TARGET_SHA" \
            --current-run-id "$GITHUB_RUN_ID"

      - name: Download artifacts from existing run
        if: ${{ inputs.publish_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-artifacts
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.publish_run_id }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="$RELEASE_REF"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi

          EXPECTED_TARGET="$(git rev-parse "$TAG_NAME^{commit}")"
          if ! REMOTE_TARGET="$(git ls-remote --exit-code origin "refs/tags/$TAG_NAME^{}" | awk 'NR == 1 { print $1 }')"; then
            echo "Remote release tag target mismatch: expected $EXPECTED_TARGET, got missing" >&2
            exit 1
          fi
          if [ "$REMOTE_TARGET" != "$EXPECTED_TARGET" ]; then
            echo "Remote release tag target mismatch: expected $EXPECTED_TARGET, got $REMOTE_TARGET" >&2
            exit 1
          fi

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          python3 scripts/validate_release_metadata.py \
            --tag "$TAG_NAME" \
            --changelog CHANGELOG.md \
            --write-notes "$NOTES_FILE"

          python3 scripts/stage_release_assets.py \
            --tag "$TAG_NAME" \
            release-artifacts \
            release-stage
          rm -r release-artifacts
          mv release-stage release-artifacts

          mapfile -t RELEASE_FILES < <(find release-artifacts -maxdepth 1 -type f -print | sort)
          if [ "${#RELEASE_FILES[@]}" -eq 0 ]; then
            echo "No release artifact files found."
            exit 1
          fi

          (
            cd release-artifacts
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          RELEASE_FILES+=("release-artifacts/SHA256SUMS")

          PRERELEASE_ARGS=()
          if [[ "$TAG_NAME" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          EXISTING_RELEASE_JSON="$RUNNER_TEMP/existing-release.json"
          RELEASE_STATE_FILE="$RUNNER_TEMP/release-state.txt"
          python3 scripts/probe_github_release.py \
            --repository "${{ github.repository }}" \
            --tag "$TAG_NAME" \
            --write-status "$RELEASE_STATE_FILE" \
            --write-json "$EXISTING_RELEASE_JSON"
          RELEASE_STATE="$(cat "$RELEASE_STATE_FILE")"

          if [ "$RELEASE_STATE" = "existing" ]; then
            python3 scripts/validate_release_metadata.py \
              --tag "$TAG_NAME" \
              --changelog CHANGELOG.md \
              --existing-release-json "$EXISTING_RELEASE_JSON"

            MISSING_RELEASE_FILES_PATH="$RUNNER_TEMP/missing-release-files.txt"
            python3 scripts/validate_existing_release_assets.py \
              --release-json "$EXISTING_RELEASE_JSON" \
              --asset-dir release-artifacts \
              --write-missing "$MISSING_RELEASE_FILES_PATH"
            mapfile -t MISSING_RELEASE_FILES < "$MISSING_RELEASE_FILES_PATH"

            if [ "${#MISSING_RELEASE_FILES[@]}" -gt 0 ]; then
              gh release upload "$TAG_NAME" "${MISSING_RELEASE_FILES[@]}" \
                --repo "${{ github.repository }}"
            else
              echo "No missing release assets to upload."
            fi
          elif [ "$RELEASE_STATE" = "absent" ]; then
            gh release create "$TAG_NAME" "${RELEASE_FILES[@]}" \
              --repo "${{ github.repository }}" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes-file "$NOTES_FILE" \
              "${PRERELEASE_ARGS[@]}"
          else
            echo "Unexpected release probe state: $RELEASE_STATE" >&2
            exit 1
          fi

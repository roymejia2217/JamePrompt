name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
      publish_run_id:
        description: Existing workflow run ID to publish from without rebuilding packages
        required: false
        type: string

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_run_id == '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            python3-pil \
            dpkg-dev \
            desktop-file-utils \
            lintian

      - name: Build Debian package
        run: packaging/linux/build-deb.sh

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: target/debian/*.deb
          if-no-files-found: error

  arch:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_run_id == '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Arch package in Arch Linux container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Sy --noconfirm --needed \
                archlinux-keyring \
                git \
                rust \
                cargo \
                desktop-file-utils \
                gtk3 \
                libappindicator-gtk3 \
                libx11 \
                libxtst \
                libxkbcommon \
                xdotool \
                fontconfig \
                freetype2 \
                gdk-pixbuf2 \
                hicolor-icon-theme \
                pkgconf \
                sqlite
              useradd -m builder
              mkdir -p /tmp/arch-build
              tar \
                --exclude=./.git \
                --exclude=./target \
                --exclude=./packaging/arch/pkg \
                --exclude=./packaging/arch/src \
                --exclude=./packaging/arch/target \
                -cf - -C /workspace . | tar -xf - -C /tmp/arch-build
              chown -R builder:builder /tmp/arch-build
              su builder -c "cd /tmp/arch-build/packaging/arch && LIBSQLITE3_SYS_USE_PKG_CONFIG=1 makepkg --nodeps --noconfirm --cleanbuild --clean"
              cp /tmp/arch-build/packaging/arch/*.pkg.tar.zst /workspace/packaging/arch/
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  rpm:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_run_id == '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM package in Fedora container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fedora:40 \
            bash -lc '
              dnf -y update
              dnf -y install git curl rpm-build cargo rust desktop-file-utils gtk3-devel libX11-devel libXtst-devel libxkbcommon-devel libxdo-devel
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              source /root/.cargo/env
              rustup toolchain install stable
              rustup default stable
              VERSION="$(sed -n '\''s/^version = "\(.*\)"/\1/p'\'' Cargo.toml | head -n 1)"
              RPM_TOPDIR="$PWD/target/rpmbuild"
              mkdir -p "$RPM_TOPDIR"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
              tar -czf "$RPM_TOPDIR/SOURCES/jame-prompt-${VERSION}.tar.gz" \
                --exclude="./target" \
                --exclude="./.git" \
                --transform="s#^\./#jame-prompt-${VERSION}/#" \
                -C "$PWD" .
              rpmbuild \
                --define "_topdir $RPM_TOPDIR" \
                --define "_sourcedir $RPM_TOPDIR/SOURCES" \
                -ba packaging/rpm/jame-prompt.spec
            '

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: target/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

  appimage:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_run_id == '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            python3-pil \
            desktop-file-utils

      - name: Download linuxdeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo linuxdeploy/linuxdeploy --pattern 'linuxdeploy-x86_64.AppImage' --dir .
          mv linuxdeploy-x86_64.AppImage linuxdeploy
          chmod +x linuxdeploy
          sudo mv linuxdeploy /usr/local/bin/linuxdeploy

      - name: Download appimagetool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo AppImage/appimagetool --pattern 'appimagetool-x86_64.AppImage' --dir .
          mv appimagetool-x86_64.AppImage appimagetool
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Build AppImage
        run: packaging/appimage/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_run_id == '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Build Windows binaries
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bins

      - name: Create portable archive
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $binaryNames = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json |
            ForEach-Object { $_.packages } |
            ForEach-Object { $_ } |
            Where-Object { $_.name -eq "jame-prompt" } |
            ForEach-Object { $_.targets } |
            Where-Object { $_.kind -contains "bin" } |
            ForEach-Object { $_.name }
          if (-not $binaryNames) {
            throw "No binary targets were discovered for packaging."
          }

          $portableRoot = "target/windows-portable"
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          Copy-Item LICENSE "$portableRoot/LICENSE"
          Copy-Item README.md "$portableRoot/README.md"
          foreach ($binaryName in $binaryNames) {
            $source = "target/x86_64-pc-windows-msvc/release/$binaryName.exe"
            if (-not (Test-Path $source)) {
              throw "Expected built binary not found: $source"
            }
            Copy-Item $source "$portableRoot/$binaryName.exe"
          }
          Compress-Archive -Path "$portableRoot/*" -DestinationPath "target/jame-prompt-$version-x86_64-pc-windows-msvc-portable.zip" -Force

      - name: Initialize WiX source
        shell: pwsh
        run: cargo wix init . --force

      - name: Build MSI
        shell: pwsh
        run: cargo wix

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: target/x86_64-pc-windows-msvc/release/*.exe
          if-no-files-found: error

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: target/jame-prompt-*-x86_64-pc-windows-msvc-portable.zip
          if-no-files-found: error

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: target/wix/*.msi
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          inputs.publish_run_id != '' ||
          (
            needs.deb.result == 'success' &&
            needs.arch.result == 'success' &&
            needs.rpm.result == 'success' &&
            needs.appimage.result == 'success'
          )
        )
      }}
    needs:
      - deb
      - arch
      - rpm
      - appimage
      - windows
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download artifacts from current run
        if: ${{ inputs.publish_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Download artifacts from existing run
        if: ${{ inputs.publish_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.publish_run_id }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          mapfile -t RELEASE_FILES < <(find release-artifacts -type f -print | sort)
          if [ "${#RELEASE_FILES[@]}" -eq 0 ]; then
            echo "No release artifact files found."
            exit 1
          fi

          (
            cd release-artifacts
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          RELEASE_FILES+=("release-artifacts/SHA256SUMS")

          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${RELEASE_FILES[@]}" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "$TAG_NAME" "${RELEASE_FILES[@]}" \
              --repo "${{ github.repository }}" \
              --title "$TAG_NAME" \
              --notes "Automated release for $TAG_NAME"
          fi
